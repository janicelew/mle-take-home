[project]
name = "company-recommendation-system"
version = "0.0.0"
description = "Turn a company event feed into a similar-companies service with RabbitMQ and pgvector."
requires-python = ">=3.13,<3.14"
dependencies = [
  "aio-pika",
  "fastapi>=0.165.0",
  "fastembed>=0.9.1",
  "pgvector>=0.5.1",
  "psycopg[binary,pool]>=3.3.9",
  "uvicorn>=0.54.0",
]

[tool.uv]
package = false
# Intel Macs have no wheels for the newest onnxruntime. Requiring this environment makes uv pick a version that
# installs everywhere (see DESIGN.md).
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not slow'"
markers = ["slow: needs the real embedding model (downloads about 220 MB on first run)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"producer/*" = ["E501"]  # provided with the assessment; left as it came
"evaluation/*" = ["E501"]  # tables of example text and long report lines, easier to read unwrapped
